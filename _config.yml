# ============================================================
# 此木暖通车间 · Hexo 主配置文件
# 主题: NexT Gemini (学术风格)
# 域名: hvac.cimugarage.cn
# ============================================================

# ---------- 站点信息 ----------
title: 此木暖通车间
subtitle: CIMU HVAC LAB
description: '暖通空调（HVAC）领域的个人开源知识库与工程工具集'
keywords: 暖通,HVAC,建筑自动化,楼宇自控,BAS,控制算法,传感器,执行器,MODBUS,水力计算
author: 此木的车间
language: zh-CN
timezone: Asia/Shanghai

# ---------- URL ----------
url: https://hvac.cimugarage.cn
root: /
permalink: :category/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

# ---------- 目录结构 ----------
source_dir: source
public_dir: public

# ---------- 写作 ----------
new_post_name: :title.md
default_layout: page
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 1
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
highlight:
  enable: true
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  enable: false
  preprocess: true
  line_number: true
  tab_replace: ''

# ---------- 分类与标签 ----------
default_category: hvac
category_map:
tag_map:

# ---------- 日期/时间格式 ----------
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: mtime

# ---------- 分页 ----------
per_page: 10
pagination_dir: page

# ---------- 扩展 ----------
theme: cimu-kb

# ---------- 部署 ----------
deploy:
  type: ''
  # 部署到 GitHub Pages 时取消注释:
  # type: git
  # repo: https://github.com/你的用户名/hvac-lab.git
  # branch: gh-pages

# ---------- 搜索 ----------
search:
  path: search.xml
  field: all
  content: true
  format: html

# ---------- 忽略文件 ----------
skip_render:
  # 工具页为独立HTML(含完整导航栏/页脚), 不经过Hexo渲染避免编码问题
  - 'hvac/tools/hydraulic-calc.html'
